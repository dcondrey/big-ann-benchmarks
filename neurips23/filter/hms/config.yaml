random-filter-s:
    hms:
      docker-tag: neurips23-filter-hms
      module: neurips23.filter.hms.hms
      constructor: HMS
      base-args: ["@metric"]
      run-groups:
        base:
          args: |
            [{"ivf_min": 2000, "cluster_size": 500, "bitset_min": 2000}]
          query-args: |
            [{"brute_max": 2000, "target": 2000},
             {"brute_max": 5000, "target": 5000}]
yfcc-10M:
    hms:
      docker-tag: neurips23-filter-hms
      module: neurips23.filter.hms.hms
      constructor: HMS
      base-args: ["@metric"]
      run-groups:
        base:
          args: |
            [{"ivf_min": 5000, "cluster_size": 1000, "max_lists": 2048,
              "bitset_min": 5000, "copy_min": 50000, "threads": 8}]
          query-args: |
            [{"brute_max": 5000, "target": 2000},
             {"brute_max": 5000, "target": 2500},
             {"brute_max": 5000, "target": 3000},
             {"brute_max": 10000, "target": 2500},
             {"brute_max": 5000, "target": 4000}]
